services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    container_name: checkpdf-mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5008
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    # Bound to localhost only; host port defaults to 5001 because macOS AirPlay occupies 5000.
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5001}:5008"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5008/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mlflow-data:
