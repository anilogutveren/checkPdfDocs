[project]
name = "checkpdfproject"
version = "0.1.0"
description = "Check PDF contract files using the local Nimble model via TypeSafe."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
     "requests>=2.34.2",
     "typesafe-sdk>=0.7.2",
     "pymupdf>=1.28.2",
     "fastapi==0.115.0",
     "uvicorn==0.32.0",
     "python-multipart==0.0.17",
]

[project.scripts]
contract-checker = "contract_checker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_checker"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
